name: Unit tests

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    unit_tests:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/workflows/actions/setup-node
            - run: npm run test:all
