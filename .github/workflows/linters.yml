name: Linters

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  linters:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/workflows/actions/setup-node
      - run: |
          npm run format:check
          npm run lint:all
