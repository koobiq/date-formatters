name: Setup Node
description: Setup Node.js environment and install dependencies
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: .nvmrc
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Dependencies
      shell: bash
      # --ignore-scripts skips the husky `prepare` hook, which has nothing to install on a runner.
      #
      # `npm ci` is sensitive to the npm version, which comes from the Node pinned in .nvmrc.
      # npm 11.6.2 (Node 24.11.1) rejects a lock that omits an optional peer dependency —
      # babel-plugin-macros for dedent, under jest-circus — while the npm that Dependabot and
      # current Node releases use does not record it. That made every Dependabot pull request
      # fail here with EUSAGE while main installed fine. Keep .nvmrc on a Node whose npm agrees
      # with the one writing the lock file.
      run: npm ci --ignore-scripts
