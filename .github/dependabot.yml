version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      # Feeds the `dependencies` label in workflows/pr-label.yml, which feeds the release notes.
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    ignore:
      # Majors here have to be upgraded deliberately: the Nx packages move as one set together
      # with the `nx` runtime, and TypeScript is pinned to what the installed Nx generators
      # support. Everything else gets major updates.
      - dependency-name: 'nx'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nx/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # ESLint is gated by Nx, and therefore by the entries above: @nx/eslint@23 declares a peer
      # of eslint ^9.0.0 || ^10.0.0, so the next major cannot be installed until Nx widens it.
      # The rest of the eslint group, @typescript-eslint included, still gets majors.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # @koobiq/cli drives the release: workflows/publish.yml is the only thing that runs it, and
      # only on a tag push, so no check in this repository executes a line of it. A major that
      # renamed a command or changed how it reads release.packages would surface for the first
      # time mid-release, after the tag exists. Upgrade it deliberately, with a local
      # `DEBUG=1 npm run publish:github-ci` first — DEBUG turns the npm publish into a dry run.
      - dependency-name: '@koobiq/cli'
        update-types: ['version-update:semver-major']
      # @types/node tracks the Node in .nvmrc, not the newest major on npm. Types from a major
      # ahead of the runtime describe APIs the code will not have, and they type-check clean.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Security fixes arrive as a single pull request rather than one per advisory.
      security:
        applies-to: security-updates
        patterns:
          - '*'
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
      eslint:
        patterns:
          - 'eslint*'
          # `eslint*` does not match scoped names, so the scopes are listed separately.
          - '@typescript-eslint/*'
      prettier:
        patterns:
          - 'prettier*'
          - 'pretty-quick'
          - '@ianvs/prettier-plugin-sort-imports'
      commitlint:
        patterns:
          - '@commitlint/*'
      jest:
        patterns:
          - 'jest*'
          - '@types/jest'
          - 'ts-jest'
      swc:
        patterns:
          - '@swc/*'
      luxon:
        patterns:
          - 'luxon'
          - '@types/luxon'
      koobiq:
        patterns:
          - '@koobiq/*'
