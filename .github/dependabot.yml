version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      # Feeds the `dependencies` label in workflows/pr-label.yml, which feeds the release notes.
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    ignore:
      # Majors here have to be upgraded deliberately: the Nx packages move as one set together
      # with the `nx` runtime, and TypeScript is pinned to what the installed Nx generators
      # support. Everything else gets major updates.
      - dependency-name: 'nx'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nx/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # eslint-plugin-import declares a peer of eslint up to ^9 and has no release accepting 10,
      # so eslint 10 fails the install for the whole workspace. @nx/eslint@23 already allows
      # ^9 || ^10 — the plugin is the only thing holding the major back. Drop this entry once
      # eslint-plugin-import ships eslint 10 support. The rest of the eslint group,
      # @typescript-eslint included, still gets majors.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    groups:
      # Security fixes arrive as a single pull request rather than one per advisory.
      security:
        applies-to: security-updates
        patterns:
          - '*'
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
      eslint:
        patterns:
          - 'eslint*'
          # `eslint*` does not match scoped names, so the scopes are listed separately.
          - '@typescript-eslint/*'
      prettier:
        patterns:
          - 'prettier*'
          - 'pretty-quick'
          - '@ianvs/prettier-plugin-sort-imports'
      commitlint:
        patterns:
          - '@commitlint/*'
      jest:
        patterns:
          - 'jest*'
          - '@types/jest'
          - 'ts-jest'
      swc:
        patterns:
          - '@swc/*'
      luxon:
        patterns:
          - 'luxon'
          - '@types/luxon'
      koobiq:
        patterns:
          - '@koobiq/*'
